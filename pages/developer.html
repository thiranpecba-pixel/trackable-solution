<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IT Developer — Trackable Solution</title>
<link rel="stylesheet" href="../css/main.css"/>
</head>
<body>
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">TS</div>
      <div><div class="logo-label">Trackable Solution</div><div class="logo-sub">IT Developer View</div></div>
    </div>
    <div class="nav-section">
      <div class="nav-label">Queue</div>
      <button class="nav-item active" onclick="showSection('pending',this)"><span class="icon">⊡</span> Pending <span id="pending-count" style="margin-left:auto;background:var(--warn);color:#000;font-size:10px;padding:1px 6px;border-radius:99px"></span></button>
      <button class="nav-item" onclick="showSection('inprogress',this)"><span class="icon">◎</span> In progress</button>
      <button class="nav-item" onclick="showSection('resolved',this)"><span class="icon">✓</span> Resolved</button>
      <button class="nav-item" onclick="showSection('all',this)"><span class="icon">▦</span> All feedback</button>
    </div>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="sb-avatar" style="border-color:var(--accent2);color:var(--accent2)">?</div>
        <div><div class="user-name" id="sb-name">Loading…</div><div class="user-role">IT Developer</div></div>
      </div>
      <button class="btn-signout" onclick="doSignOut()">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="page-title">Pending feedback</div>
        <div class="page-breadcrumb">Review and respond to worker feedback</div>
      </div>
      <div class="topbar-right">
        <div class="metric-card" style="padding:8px 16px;border-radius:8px;display:flex;gap:16px">
          <div><div class="metric-label" style="font-size:10px">Pending</div><div style="font-size:18px;font-weight:600;color:var(--warn);font-family:'DM Mono',monospace" id="t-pending">0</div></div>
          <div><div class="metric-label" style="font-size:10px">In progress</div><div style="font-size:18px;font-weight:600;color:var(--accent2);font-family:'DM Mono',monospace" id="t-prog">0</div></div>
          <div><div class="metric-label" style="font-size:10px">Resolved</div><div style="font-size:18px;font-weight:600;color:var(--accent);font-family:'DM Mono',monospace" id="t-done">0</div></div>
        </div>
      </div>
    </div>

    <div class="page-content">
      <div id="alert-area"></div>
      <div class="toolbar">
        <input class="search-input" placeholder="Search by description, department, worker…" oninput="filterFeedback(this.value)">
        <select class="form-select" style="width:auto" id="dept-filter" onchange="filterFeedback()">
          <option value="">All departments</option>
        </select>
        <select class="form-select" style="width:auto" id="type-filter" onchange="filterFeedback()">
          <option value="">All types</option>
          <option value="bug">Bugs</option>
          <option value="suggestion">Suggestions</option>
          <option value="doubt">Doubts</option>
        </select>
      </div>
      <div id="feedback-container"></div>
    </div>
  </main>
</div>

<!-- REPLY MODAL -->
<div class="modal-overlay" id="reply-modal">
  <div class="modal">
    <div class="modal-hdr"><h3>Respond to feedback</h3><button class="modal-close" onclick="closeReplyModal()">×</button></div>
    <div id="modal-feedback-detail" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:20px"></div>
    <div class="form-group">
      <label class="form-label">Your reply / solution</label>
      <textarea class="form-textarea" id="reply-text" rows="5" placeholder="Describe the solution, answer, or reason. This will be visible to the coordinator…"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">Update status</label>
      <select class="form-select" id="reply-status">
        <option value="in-progress">In progress (still working)</option>
        <option value="resolved">Resolved (completed)</option>
      </select>
    </div>
    <div id="modal-alert"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeReplyModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitReply()">Submit reply</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, onSnapshot, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig, DEPARTMENTS, FEEDBACK_TYPES, STATUS, formatDate, badge, deptColor, initials } from "../js/config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null, allFeedback = [], currentSection = 'pending', searchVal = '', selectedId = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = '../index.html'; return; }
  const snap = await getDoc(doc(db, 'users', user.uid));
  if (!snap.exists() || snap.data().role !== 'developer') { window.location.href = '../index.html'; return; }
  currentUser = { uid: user.uid, ...snap.data() };
  document.getElementById('sb-name').textContent = currentUser.name || user.email;
  document.getElementById('sb-avatar').textContent = initials(currentUser.name || user.email);
  DEPARTMENTS.forEach(d => document.getElementById('dept-filter').innerHTML += `<option value="${d}">${d}</option>`);
  onSnapshot(query(collection(db, 'feedback'), orderBy('createdAt', 'desc')), snap => {
    allFeedback = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    updateCounters();
    renderFeedback();
  });
});

function updateCounters() {
  const pend = allFeedback.filter(f => f.status === 'pending').length;
  document.getElementById('t-pending').textContent = pend;
  document.getElementById('t-prog').textContent = allFeedback.filter(f => f.status === 'in-progress').length;
  document.getElementById('t-done').textContent = allFeedback.filter(f => f.status === 'resolved').length;
  document.getElementById('pending-count').textContent = pend || '';
}

function renderFeedback() {
  const search = (document.getElementById('search-input') ? document.getElementById('search-input')?.value : searchVal || '').toLowerCase();
  const dept = document.getElementById('dept-filter')?.value || '';
  const type = document.getElementById('type-filter')?.value || '';
  let list = allFeedback.filter(f => {
    const matchSec = currentSection === 'all' || f.status === { pending: 'pending', inprogress: 'in-progress', resolved: 'resolved' }[currentSection];
    const matchDept = !dept || f.dept === dept;
    const matchType = !type || f.type === type;
    const matchSearch = !search || (f.description||'').toLowerCase().includes(search) || (f.dept||'').toLowerCase().includes(search) || (f.workerName||'').toLowerCase().includes(search);
    return matchSec && matchDept && matchType && matchSearch;
  });

  const el = document.getElementById('feedback-container');
  if (!list.length) {
    el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">✓</div><p>No items here</p></div></div>';
    return;
  }
  el.innerHTML = list.map(f => `
    <div class="card mb-16">
      <div style="display:flex;align-items:flex-start;gap:12px">
        <div style="width:4px;align-self:stretch;border-radius:99px;background:${f.priority==='critical'?'var(--danger)':f.priority==='high'?'var(--warn)':f.priority==='medium'?'var(--accent2)':'var(--border2)'}"></div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px">
            <div>
              <div style="font-size:15px;font-weight:500;margin-bottom:6px">${f.description || ''}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
                <span style="font-size:11px;padding:1px 7px;border-radius:99px;background:var(--surface3);color:var(--muted)">${f.dept}</span>
                ${badge(f.type, FEEDBACK_TYPES)}
                ${badge(f.status, STATUS)}
                <span class="badge" style="background:var(--surface3);color:${f.priority==='critical'?'var(--danger)':f.priority==='high'?'var(--warn)':'var(--muted)'}">${(f.priority||'medium').toUpperCase()}</span>
                <span class="text-sm text-muted">👤 ${f.workerName}</span>
                <span class="text-sm text-muted">📅 ${formatDate(f.createdAt)}</span>
              </div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="openReplyModal('${f.id}')">Reply</button>
          </div>
          ${f.itReply
            ? `<div class="it-reply"><div class="it-reply-label">Your reply</div><div class="it-reply-text">${f.itReply}</div></div>`
            : '<div class="awaiting-reply">No reply yet — click Reply to respond</div>'}
        </div>
      </div>
    </div>`).join('');
}

window.filterFeedback = function(val) {
  if (val !== undefined) searchVal = val;
  renderFeedback();
};

window.showSection = function(sec, el) {
  currentSection = sec;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const titles = { pending:'Pending feedback', inprogress:'In progress', resolved:'Resolved', all:'All feedback' };
  document.getElementById('page-title').textContent = titles[sec];
  renderFeedback();
};

window.openReplyModal = function(id) {
  selectedId = id;
  const f = allFeedback.find(x => x.id === id);
  if (!f) return;
  document.getElementById('modal-feedback-detail').innerHTML = `
    <div style="font-size:14px;font-weight:500;margin-bottom:8px">${f.description}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <span style="font-size:11px;background:var(--surface3);color:var(--muted);padding:1px 7px;border-radius:99px">${f.dept}</span>
      ${badge(f.type, FEEDBACK_TYPES)} — ${f.workerName} · ${formatDate(f.createdAt)}
    </div>`;
  document.getElementById('reply-text').value = f.itReply || '';
  document.getElementById('reply-modal').classList.add('open');
};

window.closeReplyModal = () => {
  document.getElementById('reply-modal').classList.remove('open');
  selectedId = null;
};

window.submitReply = async function() {
  const reply = document.getElementById('reply-text').value.trim();
  const status = document.getElementById('reply-status').value;
  if (!reply) { document.getElementById('modal-alert').innerHTML = '<div class="alert alert-danger">Please write a reply.</div>'; return; }
  await updateDoc(doc(db, 'feedback', selectedId), { itReply: reply, status, updatedAt: serverTimestamp(), repliedBy: currentUser.uid, repliedAt: serverTimestamp() });
  closeReplyModal();
  showAlert('Reply submitted!', 'success');
};

window.doSignOut = async () => { await signOut(auth); window.location.href = '../index.html'; };

function showAlert(msg, type) {
  const el = document.getElementById('alert-area');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

// expose search input reference
window.document.addEventListener('DOMContentLoaded', () => {
  window.document.querySelector('.search-input')?.setAttribute('id','search-input');
});
</script>
</body>
</html>
